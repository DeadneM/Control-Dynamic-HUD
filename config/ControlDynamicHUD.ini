[General]
Enabled=1

; Temporary diagnostic box in the top-left.
; 0 = off, 1 = on
ShowDiagnostics=0

[Hotkeys]
; Shows every HUD element managed by Control Dynamic HUD.
ShowHUDKey=F1

; How long the forced-HUD override lasts.
ShowHUDDurationMs=5000

[Health]
Enabled=1
ShowDuringCombat=1

; Show the health bar below this percentage.
ShowHealthThresholdPercent=100

; Delay before hiding at full health outside combat.
HideDelayMs=2000

; Fade duration when the mod hides/shows the bar.
FadeDurationMs=300

; Visible opacity, 0-100.
VisibleOpacityPercent=80

[MissionLog]
Enabled=1

; Delay after the HUD first appears.
InitialHideDelayMs=2000

; Delay after closing the map.
AfterMapCloseHideDelayMs=3000

; Time to remain visible after an objective update.
MissionUpdateVisibleMs=7000

FadeDurationMs=300
ShowInMap=1

[Crosshair]
Enabled=1

; Delay before hiding in normal exploration.
HideDelayMs=1000

FadeDurationMs=300

[CrosshairDot]
; TEST: hide the center dot independently using a tiny center mask on the crosshair component.
Enabled=1

; 0 = always hidden once the HUD model is updated.
; F1 temporarily restores it with the rest of the managed HUD.
HideDelayMs=0

[Expedition]
Enabled=1

; Expedition modifiers are shown briefly, then hidden.
HideDelayMs=2000

FadeDurationMs=300


[GroundSlam]
; Hides the bright world-space Slam targeting circle shown while levitating.
; 0 = vanilla circle, 1 = hide it
HideTargetCircle=1


[MultiLaunch]
; Hide only the Launch / Multi Launch object-attached HUD icon.
HideIcon=1

; Hide only the white highlight/outline around the selected launchable object.
HideOutline=1

; Older INI files using HideObjectIndicators are still supported as a fallback
; default for both options when HideIcon / HideOutline are absent.
; Split suppression is immediate in V1.0U.
HideDelayMs=0


[MainMenu]
; Protect a completed-game autosave from destructive menu paths.
; Mission Select can return progression to an earlier mission and later autosaves
; can replace the completed-state save. New Game can replace/delete that save path.
; Native action guards remain active as a safety layer while these options are enabled.
; V1.0V TEST ONLY: both save-protection options are enabled for immediate validation.
; PUBLIC RELEASE DEFAULTS MUST ALWAYS BE HideNewGame=0 / HideMissionSelect=0.
HideNewGame=1
HideMissionSelect=1


[Launch]
; Hide the Launch targeting reticle that remains on enemies/targets.
HideTargetReticle=1

; Delay before hiding it.
HideDelayMs=0
