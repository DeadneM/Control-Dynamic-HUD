name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 plugin
        shell: pwsh
        run: ./build/build.ps1
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/plugins | Out-Null
          Copy-Item build-out/ControlDynamicHUD.dll dist/plugins/
          Copy-Item config/ControlDynamicHUD.ini dist/plugins/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Control_Dynamic_HUD_V0.1_CI.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Control-Dynamic-HUD
          path: Control_Dynamic_HUD_V0.1_CI.zip
