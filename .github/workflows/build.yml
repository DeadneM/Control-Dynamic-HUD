name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embedded HUD regression checks
        run: node tests/hud-runtime.cjs

      - name: Embedded menu regression checks
        run: node tests/menu-runtime.cjs

      - name: Embedded Launch target regression checks
        run: node tests/launch-runtime.cjs

      - name: AutoContinue regression checks
        run: node tests/autocontinue-runtime.cjs

      - name: Build x64 plugin
        shell: pwsh
        run: ./build/build.ps1

      - name: Native splash state regression checks
        shell: pwsh
        run: |
          clang-cl /nologo /c /O2 /GS- /GR- /EHs-c- /Zl /DWIN32 /D_WINDOWS /Fo:build-out/SplashNativeTests.obj tests/splash-native.cpp
          if ($LASTEXITCODE -ne 0) { throw "Native tests compile failed" }
          lld-link /entry:TestMain /subsystem:console /machine:x64 /nodefaultlib /dynamicbase /nxcompat /out:build-out/SplashNativeTests.exe build-out/SplashNativeTests.obj
          if ($LASTEXITCODE -ne 0) { throw "Native tests link failed" }
          ./build-out/SplashNativeTests.exe
          if ($LASTEXITCODE -ne 0) { throw "Native splash test failed: $LASTEXITCODE" }

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/plugins | Out-Null
          Copy-Item build-out/ControlDynamicHUD.dll dist/plugins/
          Compress-Archive -Path dist/* -DestinationPath Control_Dynamic_HUD_CI.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path Control_Dynamic_HUD_CI.zip))
          try {
            $files = @($zip.Entries | Where-Object { $_.Name } | ForEach-Object FullName)
            if ($files.Count -ne 1 -or $files[0] -ne 'plugins/ControlDynamicHUD.dll') { throw "Unexpected package contents" }
          } finally { $zip.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: Control-Dynamic-HUD-CI
          path: Control_Dynamic_HUD_CI.zip

      - name: Publish v1.0.3 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item Control_Dynamic_HUD_CI.zip Control_Dynamic_HUD_v1.0.3.zip
          gh release view v1.0.3 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v1.0.3 already published; leaving it unchanged"; exit 0 }
          gh release create v1.0.3 Control_Dynamic_HUD_v1.0.3.zip config/ControlDynamicHUD.ini --target "$env:GITHUB_SHA" --title "Control Dynamic HUD v1.0.3" --notes-file docs/CHANGELOG_v1.0.3.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
